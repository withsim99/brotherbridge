name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build variant to generate"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure .env exists for Secrets Gradle Plugin
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Debug APK artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: BrotherBridge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Decode Release Keystore (if configured)
        id: release_keystore
        if: ${{ inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "${BUILD_TYPE}" = "release" ]; then
            echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret required for release APK builds."
            exit 1
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release APK
        if: ${{ steps.release_keystore.outputs.available == 'true' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload Release APK artifact
        if: ${{ steps.release_keystore.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: BrotherBridge-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release (on version tag)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
